<body>
    <div data-role="page" id="encuesta">
        <div data-role="header" data-theme="b">
            <h1>Encuesta Institucional UPVM</h1>
        </div>

        <div role="main" class="ui-content" style="padding: 15px;">
            <div class="card-neon" style="display: flex; align-items: center; gap: 15px; padding: 15px; margin-bottom: 15px;">
                <img class="profile-photo-small" src="images/oscar.jpg" alt="Oscar" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80'">
                <div>
                    <h4 style="color: #ff007f; margin: 0;">Oscar Daniel Perez Aldana</h4>
                    <p style="color: #9ca3af; font-size: 12px; margin: 2px 0 0 0;">ITID • UPVM</p>
                </div>
            </div>

            <div class="nav-panel">
                <a href="index.html" class="ui-btn btn-pagina" style="border-color: #00f3ff !important; color: #00f3ff !important;">Volver al Inicio</a>
            </div>

            <div class="card-neon">
                <h3 style="color: #00f3ff; margin-top: 0;">Cuestionario UPVM (5 Preguntas)</h3>
                <p style="color: #9ca3af; font-size: 12px; margin-bottom: 20px;">Los datos se registrarán en la base de datos institucional.</p>

                <form action="guardar.php" method="POST">
                    <div>
                        <label>Nombre del participante:</label>
                        <input type="text" name="nombre" required placeholder="Ej. Juan Pérez">
                    </div>
                    <div>
                        <label>Matrícula / ID:</label>
                        <input type="text" name="matricula" required placeholder="Ej. 31230000">
                    </div>

                    <div>
                        <label>1. ¿Cómo calificarías el nivel de preparación y enseñanza de los profesores de la UPVM?</label>
                        <select name="p1" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Excelente">Excelente</option>
                            <option value="Bueno">Bueno</option>
                            <option value="Regular">Regular</option>
                            <option value="Deficiente">Deficiente</option>
                        </select>
                    </div>

                    <div>
                        <label>2. ¿Qué tan adecuadas consideras que son las instalaciones y laboratorios de cómputo?</label>
                        <select name="p2" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Muy adecuadas">Muy adecuadas</option>
                            <option value="Adecuadas">Adecuadas</option>
                            <option value="Faltan equipos">Faltan equipos o mantenimiento</option>
                            <option value="Insuficientes">Insuficientes</option>
                        </select>
                    </div>

                    <div>
                        <label>3. ¿Cómo calificas el servicio de atención en áreas administrativas y escolares?</label>
                        <select name="p3" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Rápido y eficiente">Rápido y eficiente</option>
                            <option value="Regular">Regular</option>
                            <option value="Lento">Lento</option>
                        </select>
                    </div>

                    <div>
                        <label>4. ¿Qué tan satisfecho estás con el ambiente estudiantil y cultural en la universidad?</label>
                        <select name="p4" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Muy satisfecho">Muy satisfecho</option>
                            <option value="Satisfecho">Satisfecho</option>
                            <option value="Poco satisfecho">Poco satisfecho</option>
                        </select>
                    </div>

                    <div>
                        <label>5. En general, ¿recomendarías estudiar en la Universidad Politécnica del Valle de México?</label>
                        <select name="p5" required>
                            <option value="">Selecciona una opción...</option>
                            <option value="Definitivamente sí">Definitivamente sí</option>
                            <option value="Tal vez">Tal vez</option>
                            <option value="No lo recomendaría">No lo recomendaría</option>
                        </select>
                    </div>

                    <div style="text-align: center; margin-top: 25px;">
                        <button type="submit" class="ui-btn btn-pagina" style="width: 100%; border-color: #00f3ff !important; color: #00f3ff !important; font-size: 15px;">Enviar Encuesta y Reclamar Regalo 🎁</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
